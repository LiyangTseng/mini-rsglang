[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3"
hf-hub = { version = "1.0.0", features = ["blocking"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
minijinja = { version = "2.24.0", features = ["json", "loader"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
reqwest = "0.13.5"
rmp-serde = "1.3.1"
rsg-tokenizer = { path = "crates/rsg-tokenizer" }
rsg-wire = { path = "crates/rsg-wire" }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig", "esaxx_fast"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zmq = "0.10.0"
